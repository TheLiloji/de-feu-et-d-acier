eyebrow: La rigueur
titreLigne1: Le geste juste,
titreLigne2: avant le costume.
lede: >-
  On étudie les arts martiaux européens à partir des traités et sources
  historiques, dans une pratique moderne, sportive et sécurisée.
texte: >-
  Ici, on s'entraîne en tenue de sport, masque d'escrime et protections
  modernes, avec des armes d'entraînement adaptées à chaque discipline. Les
  sources sont à la base de notre travail : on pousse leur application
  jusqu'en assaut, à différents niveaux d'engagement.
lien:
  libelle: Parcourir les sources du club
  url: /sources/
