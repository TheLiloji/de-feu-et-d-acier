eyebrow: La rigueur
titreLigne1: Le geste juste,
titreLigne2: avant le costume.
lede: >-
  On étudie les arts martiaux européens à partir des traités et sources
  historiques, dans une pratique moderne, sportive et sécurisée. On y vient pour
  le geste, pas pour le costume.
texte: >-
  Ici on s'entraîne en tenue de sport, masque d'escrime et protections modernes,
  avec des armes d'entraînement adaptées à chaque discipline. Les sources sont à
  la base de notre travail, et nous poussons leur application jusqu'en assaut,
  avec différents niveaux d'engagement.
