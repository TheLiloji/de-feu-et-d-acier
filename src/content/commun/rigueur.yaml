    manuscrites.
  cadrage: centre
  credit: ''
legendePlanche: >-
  Planche extraite d'un traité d'escrime historique. Étude des gardes, des
  distances, du timing — des gestes que l'on cherche à comprendre, puis à
  éprouver dans la salle.
