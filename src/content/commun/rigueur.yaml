legendePlanche: >-
  Page de titre de « La noble science des joueurs d'espée », imprimée à Anvers en
  1538 : la plus ancienne description en français des gestes que l'on travaille
  ici. Gardes, distances, temps : ce que l'on cherche d'abord à comprendre, puis
  à éprouver en salle.
