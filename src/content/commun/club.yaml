eyebrow: Le club
titreLigne1: Une bande
titreLigne2: d'escrimeurs,
titreLigne3: une école.
texte: >-
  Section AMHE de l'USAM Clermont-Ferrand, affiliée à la FFAMHE, le club
  accueille débutants et pratiquants confirmés, en loisir comme en compétition.
  Encadrement assuré par Gabriel Tardio. La salle est ouverte à toutes et tous,
  et l'on prend le temps de bien faire les choses.
photo:
  fichier: /src/assets/photos/commun/club-demo-montferrand.jpg
  alt: >-
    Démonstration d'escrime historique sous une halle, devant un public assis :
    deux membres du club s'affrontent pendant qu'un présentateur commente au
    micro.
  cadrage: centre
  credit: Alexandre Vergne — L'IMAGINARIUM
chiffres: []
piliers:
  - titre: Source.
    texte: >-
      Étude des textes et traités historiques. Lecture, mise en pratique,
      reconstitution martiale des gestes anciens.
  - titre: Geste.
    texte: >-
      Technique structurée par le drill, le sentiment du fer, et la mise en
      pratique en assaut libre.
  - titre: Salle.
    texte: >-
      Un esprit d'école d'armes : exigence sportive, respect du partenaire, et
      progression à son rythme.
