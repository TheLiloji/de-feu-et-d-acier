eyebrow: Le club
titreLigne1: Une bande
titreLigne2: d'escrimeurs,
titreLigne3: une école.
texte: >-
  Le club est la section AMHE de l'USAM Clermont-Ferrand, affiliée à la
  FFAMHE, encadrée par Gabriel Tardio. On accueille débutants et pratiquants
  confirmés, en loisir comme en compétition. La salle est ouverte à toutes et
  tous, et on prend le temps de bien faire les choses.
photo:
  fichier: /src/assets/photos/commun/club-groupe-panorama.jpg
  alt: >-
    Photo de groupe du club dans le gymnase, chacun dans une pose
    fantaisiste.
  cadrage: centre
  credit: ''
chiffres: []
piliers:
  - titre: Source.
    texte: >-
      Étude des textes et traités historiques. On les lit, on remet les
      gestes anciens en pratique.
  - titre: Geste.
    texte: >-
      On travaille la technique au drill et au sentiment du fer, puis on la
      teste en assaut libre.
  - titre: Salle.
    texte: >-
      Un esprit d'école d'armes : on est exigeant, on respecte le partenaire,
      et chacun progresse à son rythme.
