hebergeur:
  nom: Cloudflare, Inc.
  adresse: 101 Townsend St, San Francisco, CA 94107, USA
rgpd:
  paragraphes:
    - >-
      Ce site ne dépose aucun cookie, n'utilise aucun outil d'analyse d'audience
      et ne stocke aucune donnée personnelle côté serveur.
    - >-
      Les liens de contact ouvrent votre application de messagerie ou votre
      téléphone avec un message pré-rempli. Aucune information n'est envoyée
      vers ce site ni vers un service tiers : l'envoi se fait depuis votre
      propre boîte mail.
    - >-
      Les coordonnées affichées (mail, téléphone, adresse) sont celles
      communiquées volontairement par les responsables du club pour leurs
      fonctions associatives.
  note: >-
    Conformément au RGPD, vous disposez d'un droit d'accès, de rectification et
    de suppression sur les données qui vous concernent. Pour exercer ces droits,
    écrivez à {email}.
