faq:
  eyebrow: Questions fréquentes
  titreLigne1: Tout ce qu'on
  titreLigne2: nous demande.
  lede: >-
    Les questions qu'on entend le plus souvent au premier contact. Si la vôtre
    n'y est pas, écrivez-nous à {email} — on répond.
sources:
  eyebrow: Les sources
  titreLigne1: La bibliothèque
  titreLigne2: du club.
  lede: >-
    Les AMHE ne se transmettent pas de maître en maître : elles se lisent.
    L'essentiel de ce qui se travaille en salle vient de traités écrits entre le
    XIVᵉ et le XVIIᵉ siècle, que l'on étudie, met en mouvement, puis éprouve en
    assaut. Voici ceux sur lesquels le club travaille — le haut Moyen Âge, lui,
    n'a laissé aucun manuel d'escrime, et le combat viking se reconstruit
    autrement.
partenaires:
  eyebrow: Partenaires
  titreLigne1: Sans eux,
  titreLigne2: rien de tout ça.
  lede: >-
    Un club n'existe pas tout seul. Il existe parce qu'une fédération porte la
    discipline au niveau national, parce que des artisans fabriquent du matériel
    pensé pour cette pratique, et parce que ces gens-là partagent la même
    exigence que nous. Les trois ci-dessous, on ne se contente pas de les
    mentionner — on les recommande, on travaille avec eux, et on t'invite à
    aller voir.
