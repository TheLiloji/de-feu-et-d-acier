faq:
  eyebrow: Questions fréquentes
  titreLigne1: Tout ce qu'on
  titreLigne2: nous demande.
  lede: >-
    Les questions qu'on entend le plus souvent au premier contact. Si la
    tienne n'y est pas, écris-nous à {email}. On répond.
sources:
  eyebrow: Les sources
  titreLigne1: La bibliothèque
  titreLigne2: du club.
  lede: >-
    On travaille sur des traités écrits entre le XIIIᵉ et le XVIIᵉ siècle. On
    les étudie, puis on les met à l'épreuve en salle. Le haut Moyen Âge n'a
    laissé aucun manuel d'escrime, et le combat viking se reconstruit
    autrement.
partenaires:
  eyebrow: Partenaires
  titreLigne1: Sans eux,
  titreLigne2: rien de tout ça.
  lede: >-
    Une fédération porte la discipline au niveau national, des artisans
    fabriquent du matériel pensé pour cette pratique. Le club ne s'en sort pas
    sans eux. Les trois ci-dessous, on les recommande vraiment, on travaille
    avec eux : va voir.
