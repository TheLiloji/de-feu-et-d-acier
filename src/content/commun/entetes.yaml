  eyebrow: Les profs
  titreLigne1: '{nb_profs} encadrants,'
  titreLigne2: '{nb_profs} écoles.'
  lede: >-
    Chaque arme a son référent. Sa pédagogie vient de son expérience de
    pratiquant et de ses heures de lecture des sources.
