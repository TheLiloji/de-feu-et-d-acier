disciplines:
  eyebrow: Les disciplines
  titreLigne1: '{nb_armes} armes,'
  titreLigne2: '{nb_armes} grammaires.'
  lede: >-
    On peut tout pratiquer, on peut se spécialiser. Chaque arme ouvre une école
    de pensée et un répertoire technique distincts, étalés sur plusieurs siècles.
profs:
  eyebrow: Les profs
  titreLigne1: '{nb_profs} encadrants,'
  titreLigne2: '{nb_profs} écoles.'
  lede: >-
    Chaque arme a son référent. Tous transmettent à leur rythme, avec une
    pédagogie qui leur est propre et qui est issue d'une longue expérience de
    pratiquant, ainsi que de nombreuses heures de lecture des sources.
